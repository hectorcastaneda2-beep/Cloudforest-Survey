<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monteverde Visitor Survey</title>
<style>
:root{--bg:#f4f6f2;--card:#fff;--ink:#1b2a22;--mut:#5b6b62;--line:#d3dbd5;--acc:#1f6f4a;--ai:#fff;--sel:#e1f1e8;--warn:#a4400f}
@media (prefers-color-scheme:dark){:root{--bg:#101913;--card:#1a2620;--ink:#e8efe9;--mut:#9fb0a6;--line:#2f4037;--acc:#5fc08f;--ai:#08130d;--sel:#21372b;--warn:#f0a070}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
#app{max-width:560px;margin:0 auto;padding:14px 16px 28px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.bar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);transition:width .25s}
.lang{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 10px;font-size:14px;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 18px}
h1{font-size:24px;line-height:1.25;margin:0 0 8px}
.sec{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin-bottom:8px}
.hint{background:#e6f0e9;color:#14261c;font-size:16px;line-height:1.4;margin:0 0 14px;padding:10px 12px;border-radius:10px;border-left:4px solid #1f6f4a}.hint:empty{display:none}
p{margin:0 0 12px}
.opt{display:block;width:100%;text-align:left;min-height:52px;margin:0 0 10px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.opt.on{border-color:var(--acc);background:var(--sel);font-weight:600}
.row{display:flex;gap:8px}.row .opt{text-align:center;padding:12px 0}
.ends{display:flex;justify-content:space-between;color:var(--mut);font-size:15px;margin-top:-2px}
input.f{width:100%;font:inherit;font-size:22px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
input.f:focus{outline:2px solid var(--acc);border-color:var(--acc)}
.pre{display:flex;align-items:center;gap:8px;font-size:22px}
.err{color:var(--warn);font-size:14px;margin-top:10px;min-height:18px}
.nav{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;min-height:50px;border-radius:12px;font:inherit;font-weight:600;cursor:pointer;border:1.5px solid var(--acc);background:var(--acc);color:var(--ai)}
.btn.g{background:transparent;color:var(--acc)}
.card.scn{border-color:var(--acc);border-width:2px}
.link{background:none;border:0;color:var(--mut);font-size:13px;text-decoration:underline;cursor:pointer;margin-top:18px}
.st{color:var(--mut);font-size:15px;margin:12px 0 0}
/*seg*/
.seg{display:flex;gap:8px;margin:0 0 10px}.seg .opt{min-height:40px;margin:0;text-align:center;padding:8px 6px;font-size:15px}
select.f{width:100%;font:inherit;font-size:22px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
.echo{background:#fff6dc;color:#3a2e00;border-left:4px solid #c8960c;padding:10px 12px;border-radius:10px;margin:10px 0 0;font-size:16px;line-height:1.4;display:none}
.flab{display:block;font-weight:600;margin:14px 0 2px}.fh{color:var(--mut);font-size:14px;margin:0 0 6px}
.pic{margin:4px 0 14px}.picc{display:flex;justify-content:space-between;font-size:14px;color:var(--mut);margin-top:6px}.picn{font-size:12px;color:var(--mut);text-align:center;margin-top:2px}
table{border-collapse:collapse;font-size:14px;width:100%}td{padding:4px 0;border-bottom:1px solid var(--line)}
</style></head>

 function next(){
